# TEMPLATE ONLY - copy to k8s/secret.yaml (git-ignored), fill in real values, then `kubectl apply -f k8s/secret.yaml`
# or use sealed-secrets / external-secrets. Never commit real values.
apiVersion: v1
kind: Secret
metadata: { name: retailpulse-secrets, namespace: retailpulse }
type: Opaque
stringData:
  RETAILPULSE_SALT: "CHANGE_ME_long_random_string"
  RETAILPULSE_ANALYST_PIN: "CHANGE_ME"
  RETAILPULSE_ADMIN_PIN: "CHANGE_ME"
  RETAILPULSE_JWT_SECRET: "CHANGE_ME_at_least_32_characters_long"
  DATABASE_URL: "postgresql+psycopg2://USER:PASSWORD@postgres.retailpulse.svc:5432/retailpulse"
