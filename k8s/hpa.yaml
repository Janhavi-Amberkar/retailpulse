apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: retailpulse-app, namespace: retailpulse }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: retailpulse-app }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
