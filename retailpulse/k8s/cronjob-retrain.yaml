apiVersion: batch/v1
kind: CronJob
metadata: { name: retailpulse-retrain, namespace: retailpulse }
spec:
  schedule: "0 2 * * *"          # daily batch, mirrors the Airflow DAG
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: trainer
              image: ghcr.io/YOUR_GITHUB_USER/retailpulse-ml:latest
              command: ["python", "scripts/retrain.py"]      # retrains only when drift policy triggers
              envFrom: [{ configMapRef: { name: retailpulse-config } }, { secretRef: { name: retailpulse-secrets } }]
              resources: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "2", memory: 4Gi } }
