[project]
name = "retailpulse"
version = "2.0.0"
description = "AI-powered customer analytics and demand forecasting platform (Zidio Data Science & Analytics)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "app", "api", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E402", "UP037", "B905", "B904", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "F841"]
"app/pages/*" = ["E402", "F401", "I001"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
