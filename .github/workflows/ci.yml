name: CI
on:
  push: { branches: [main, "feature/**"] }
  pull_request: { branches: [main] }

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check --line-length 120 src app api tests scripts airflow

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # tests need the light stack + sklearn/fastapi - not torch/prophet (those stages run in `make pipeline`)
      - run: |
          pip install -r requirements.txt scikit-learn sqlalchemy holidays statsmodels fastapi pyjwt httpx pytest pytest-cov xgboost
          pytest --cov=src --cov-report=term-missing

  smoke-dashboard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Boot Streamlit and probe health
        run: |
          streamlit run app/streamlit_app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && exit 0; sleep 2; done; exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/retailpulse:latest,ghcr.io/${{ github.repository_owner }}/retailpulse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
