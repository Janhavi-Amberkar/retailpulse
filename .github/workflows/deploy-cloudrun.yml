name: Deploy to Google Cloud Run (manual)
# Optional cloud deployment (spec day 25: AWS or GCP). Requires repo secrets: GCP_PROJECT, GCP_SA_KEY, GCP_REGION.
on: { workflow_dispatch: {} }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & deploy
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/retailpulse --project ${{ secrets.GCP_PROJECT }}
          gcloud run deploy retailpulse --image gcr.io/${{ secrets.GCP_PROJECT }}/retailpulse \
            --region ${{ secrets.GCP_REGION }} --project ${{ secrets.GCP_PROJECT }} --platform managed \
            --allow-unauthenticated --port 8501 --memory 1Gi --cpu 1 --min-instances 0
