groups:
  - name: retailpulse
    rules:
      - alert: DataDriftHigh
        expr: retailpulse_drift_share > 0.30
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 30% of model input features drifted - retraining recommended" }
      - alert: ChurnModelDegraded
        expr: retailpulse_churn_auc < 0.75
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Churn AUC fell below 0.75" }
      - alert: ForecastMapeHigh
        expr: retailpulse_forecast_mape{horizon="weekly"} > 18
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Weekly forecast MAPE above 18%" }
      - alert: BatchTooSlow
        expr: histogram_quantile(0.95, sum(rate(retailpulse_batch_seconds_bucket[1h])) by (le)) > 300
        labels: { severity: critical }
        annotations: { summary: "Daily batch p95 exceeds the 5-minute SLO" }
